# Roadi GitHub Pages deployment
name: Deploy Roadi privacy policy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          GITHUB_ACTIONS: true
        run: |
          pnpm build
          mkdir -p dist/public/en dist/public/vi dist/public/th dist/public/ms dist/public/id dist/public/lite/en dist/public/lite/vi dist/public/lite/th dist/public/lite/ms dist/public/lite/id
          cp dist/public/index.html dist/public/en/index.html
          cp dist/public/index.html dist/public/vi/index.html
          cp dist/public/index.html dist/public/th/index.html
          cp dist/public/index.html dist/public/ms/index.html
          cp dist/public/index.html dist/public/id/index.html
          cp dist/public/index.html dist/public/lite/index.html
          cp dist/public/index.html dist/public/lite/en/index.html
          cp dist/public/index.html dist/public/lite/vi/index.html
          cp dist/public/index.html dist/public/lite/th/index.html
          cp dist/public/index.html dist/public/lite/ms/index.html
          cp dist/public/index.html dist/public/lite/id/index.html
          cp dist/public/index.html dist/public/404.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Premium｜路迪車管家</title>#' dist/public/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Premium｜Vehicle Care Privacy Policy</title>#' dist/public/en/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi｜Vehicle Companion Privacy Policy</title>#' dist/public/vi/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi｜นโยบายความเป็นส่วนตัว</title>#' dist/public/th/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi｜Dasar Privasi</title>#' dist/public/ms/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi｜Kebijakan Privasi</title>#' dist/public/id/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Lite｜隱私權政策</title>#' dist/public/lite/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Lite｜Vehicle Care Privacy Policy</title>#' dist/public/lite/en/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Lite｜Chính sách quyền riêng tư</title>#' dist/public/lite/vi/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Lite｜นโยบายความเป็นส่วนตัว</title>#' dist/public/lite/th/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Lite｜Dasar Privasi</title>#' dist/public/lite/ms/index.html
          sed -i 's#<title>[^<]*</title>#<title>Roadi Lite｜Kebijakan Privasi</title>#' dist/public/lite/id/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
